name: jahez
description: "Jahez — employee attendance app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  camera: ^0.12.2
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  google_mlkit_face_detection: ^1.0.1
  image: ^4.12.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  tflite_flutter: ^0.12.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/models/face_recognition.tflite
